<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 350px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Grade Calculator</h2>

    <label>Subject 1:</label>
    <input type="number" id="sub1" min="0" max="100">

    <label>Subject 2:</label>
    <input type="number" id="sub2" min="0" max="100">

    <label>Subject 3:</label>
    <input type="number" id="sub3" min="0" max="100">

    <label>Subject 4:</label>
    <input type="number" id="sub4" min="0" max="100">

    <label>Subject 5:</label>
    <input type="number" id="sub5" min="0" max="100">

    <button onclick="calculateGrade()">Calculate Result</button>

    <div id="result"></div>
</div>

<script>
    function calculateGrade() {

        let marks1 = Number(document.getElementById("sub1").value);
        let marks2 = Number(document.getElementById("sub2").value);
        let marks3 = Number(document.getElementById("sub3").value);
        let marks4 = Number(document.getElementById("sub4").value);
        let marks5 = Number(document.getElementById("sub5").value);

        let total = marks1 + marks2 + marks3 + marks4 + marks5;
        let percentage = total / 5;
        let grade;

        if (percentage >= 90) {
            grade = "A+";
        } else if (percentage >= 80) {
            grade = "A";
        } else if (percentage >= 70) {
            grade = "B";
        } else if (percentage >= 60) {
            grade = "C";
        } else if (percentage >= 50) {
            grade = "D";
        } else {
            grade = "F";
        }

        document.getElementById("result").innerHTML =
            "<strong>Total Marks:</strong> " + total + " / 500<br>" +
            "<strong>Percentage:</strong> " + percentage.toFixed(2) + "%<br>" +
            "<strong>Grade:</strong> " + grade;
    }
</script>

</body>
</html>
