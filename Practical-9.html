
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <!-- Main Container -->
    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            My To-Do List
        </h1>

        <!-- Input Section -->
        <div class="flex gap-2 mb-6">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            >

            <button
                onclick="addTask()"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"
            >
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

    </div>

    <script>
        function addTask() {
            const taskInput = document.getElementById("taskInput");
            const taskText = taskInput.value.trim();

            // Check if input is empty
            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            // Create list item
            const li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-50 border p-3 rounded-lg";

            li.innerHTML = `
                <div class="flex items-center gap-3">
                    <input
                        type="checkbox"
                        onchange="completeTask(this)"
                        class="w-5 h-5"
                    >

                    <span class="task-text">${taskText}</span>
                </div>

                <button
                    onclick="deleteTask(this)"
                    class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                >
                    Delete
                </button>
            `;

            // Add task to list
            document.getElementById("taskList").appendChild(li);

            // Clear input
            taskInput.value = "";
        }

        // Mark task as completed
        function completeTask(checkbox) {
            const taskText = checkbox.parentElement.querySelector(".task-text");

            if (checkbox.checked) {
                taskText.classList.add("line-through", "text-gray-400");
            } else {
                taskText.classList.remove("line-through", "text-gray-400");
            }
        }

        // Delete task
        function deleteTask(button) {
            button.parentElement.remove();
        }

        // Add task by pressing Enter
        document.getElementById("taskInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>

</body>
</html>
